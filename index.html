<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Two Player Snake Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Two Player Snake Game</h1>
  
  <div class="scoreboard">
    <div>Player 1 Wins: <span id="player1Wins">0</span></div>
    <div>Player 2 Wins: <span id="player2Wins">0</span></div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="current-scores">
    <div>Player 1 Score: <span id="player1Score">0</span></div>
    <div>Player 2 Score: <span id="player2Score">0</span></div>
  </div>

  <button onclick="resetGame()">Restart Game</button>

  <script src="script.js"></script>
</body>
</html>
